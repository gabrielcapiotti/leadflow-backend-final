version: '3.9'

services:

  # PostgreSQL Database
  postgres:
    build:
      context: .
      dockerfile: Dockerfile.postgres
    container_name: leadflow_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-leadflow_dev}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_INITDB_ARGS: "-c shared_buffers=256MB -c max_connections=100"
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./pgbackrest.conf:/etc/pgbackrest/pgbackrest.conf:ro
      - ./database/official:/docker-entrypoint-initdb.d:ro
    networks:
      - leadflow_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Spring Boot Application
  # NOTE (Etapa 5.8): application-*.yml profiles removed (prod/dev/test/integration)
  # Configuration now comes from application.yml + env vars below
  # SPRING_PROFILES_ACTIVE default is 'dev' for docker-compose local development
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: leadflow_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Profile & Server
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SERVER_PORT: ${SERVER_PORT:-8080}
      SERVER_SSL_ENABLED: ${SERVER_SSL_ENABLED:-false}
      SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE: ${SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE:-5MB}
      SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE: ${SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE:-5MB}
      
      # Database (Spring Datasource via application.yml)
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-leadflow_dev}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      
      # Security
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-3600000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      
      # Email (SendGrid & Spring Mail)
      SENDGRID_API_KEY: ${SENDGRID_API_KEY}
      SENDGRID_WEBHOOK_VERIFY_SIGNATURE: ${SENDGRID_WEBHOOK_VERIFY_SIGNATURE:-false}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_FROM: ${MAIL_FROM:-no-reply@leadflow.com}
      MAIL_REPLY_TO: ${MAIL_REPLY_TO:-support@leadflow.com}
      
      # Stripe (Webhooks & Payment)
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      STRIPE_WEBHOOK_ALERT_THRESHOLD: ${STRIPE_WEBHOOK_ALERT_THRESHOLD:-5}
      
      # OpenAI
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      
      # System
      SYSTEM_ADMIN_EMAIL: ${SYSTEM_ADMIN_EMAIL}
      
      # Logging
      LOGGING_LEVEL_ROOT: ${LOGGING_LEVEL_ROOT:-INFO}
      
      # Frontend
      APP_FRONTEND_URL: ${APP_FRONTEND_URL:-http://localhost:3000}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    ports:
      - "${SERVER_PORT:-8080}:${SERVER_PORT:-8080}"
    volumes:
      - ./src:/app/src:ro
    networks:
      - leadflow_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${SERVER_PORT:-8080}/actuator/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # pgBackRest Backup Service (Optional)
  pgbackrest:
    build:
      context: .
      dockerfile: Dockerfile.pgbackrest
    container_name: leadflow_pgbackrest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGBACKREST_REPO_PATH: /var/lib/pgbackrest
      PGBACKREST_REPO_HOST: postgres
      PGBACKREST_DB_USER: ${DB_USER:-postgres}
      PGBACKREST_DB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgbackrest_data:/var/lib/pgbackrest
      - ./pgbackrest.conf:/etc/pgbackrest/pgbackrest.conf:ro
    networks:
      - leadflow_network

volumes:
  postgres_data:
    driver: local
  pgbackrest_data:
    driver: local

networks:
  leadflow_network:
    driver: bridge