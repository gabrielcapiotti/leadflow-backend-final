apiVersion: v1
kind: Secret
metadata:
  name: leadflow-secrets
  namespace: leadflow
type: Opaque
data:
  # ============================================
  # Database Secrets
  # ============================================
  
  # PostgreSQL - Option 1: Self-hosted (StatefulSet)
  # DB_USERNAME: "postgres"
  # DB_PASSWORD: "postgres-secure-password"
  # DB_URL: "jdbc:postgresql://postgres-statefulset.leadflow.svc.cluster.local:5432/leadflow_db"
  
  # PostgreSQL - Option 2: Railway.app (Recommended for PaaS)
  DB_USERNAME: "postgres"
  DB_PASSWORD: "iGwdTVCetOABiwbKgOlSNyuocXvmfrDy"
  DB_URL: "jdbc:postgresql://postgres.railway.internal:5432/railway"
  
  # ============================================
  # Email Configuration (SMTP)
  # ============================================
  MAIL_USERNAME: "your-smtp-username"
  MAIL_PASSWORD: "your-smtp-password"
  
  # ============================================
  # Stripe (Production Keys)
  # Replace with actual keys from https://dashboard.stripe.com
  # ============================================
  STRIPE_SECRET_KEY: "sk_live_your_actual_key_here"
  STRIPE_PUBLISHABLE_KEY: "pk_live_your_actual_key_here"
  STRIPE_WEBHOOK_SECRET: "whsec_live_your_actual_key_here"
  
  # ============================================
  # SendGrid
  # ============================================
  SENDGRID_API_KEY: "SG.your_sendgrid_key_here"
  
  # ============================================
  # OpenAI
  # ============================================
  OPENAI_API_KEY: "sk-your_openai_key_here"
  
  # ============================================
  # JWT
  # ============================================
  JWT_SECRET: "your-jwt-secret-key-min-32-chars"
  
  # ============================================
  # Application
  # ============================================
  APP_NAME: "LeadFlow"
  APP_VERSION: "1.0.0"
  APP_ENVIRONMENT: "production"
