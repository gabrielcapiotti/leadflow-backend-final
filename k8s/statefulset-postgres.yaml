---
# StatefulSet for PostgreSQL (persistent database)
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: leadflow
  labels:
    app: postgres
    tier: database
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
      tier: database
  template:
    metadata:
      labels:
        app: postgres
        tier: database
    spec:
      containers:
      - name: postgres
        image: postgres:16.13-alpine
        imagePullPolicy: IfNotPresent
        ports:
        - name: postgresql
          containerPort: 5432
        env:
        - name: POSTGRES_DB
          value: "leadflow"
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: leadflow-secrets
              key: SPRING_DATASOURCE_USERNAME
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: leadflow-secrets
              key: SPRING_DATASOURCE_PASSWORD
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - pg_isready -U $POSTGRES_USER
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - pg_isready -U $POSTGRES_USER
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 3
        volumeMounts:
        - name: pgdata
          mountPath: /var/lib/postgresql/data
        - name: pgbackrest-config
          mountPath: /etc/pgbackrest
          readOnly: true
      volumes:
      - name: pgbackrest-config
        configMap:
          name: pgbackrest-config
          optional: true
  volumeClaimTemplates:
  - metadata:
      name: pgdata
    spec:
      accessModes: [ "ReadWriteOnce" ]
      storageClassName: "standard"
      resources:
        requests:
          storage: 10Gi

---
# Service for PostgreSQL StatefulSet
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: leadflow
  labels:
    app: postgres
    tier: database
spec:
  clusterIP: None
  selector:
    app: postgres
    tier: database
  ports:
  - name: postgresql
    protocol: TCP
    port: 5432
    targetPort: 5432
