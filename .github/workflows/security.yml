name: Security

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main, develop ]
  schedule:
    - cron: '0 2 * * *'  # Daily at 2 AM UTC

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dependency-check:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          path: '.'
          format: 'JSON,SARIF'
          project: 'leadflow-backend'
          args: >-
            --enableExperimental
            --enableRetired
            --scan ./pom.xml
            --fail-on-cvss 7.0

      - name: Upload Dependency Check SARIF
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: reports/dependency-check-report.sarif
          category: dependency-check

      - name: Upload Dependency Check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: reports/
          retention-days: 30
          if-no-files-found: ignore

  maven-security:
    name: Maven Vulnerability Check
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: '**/pom.xml'

      - name: Check for Maven vulnerabilities
        run: |
          mvn org.owasp:dependency-check-maven:check \
            -Ddependency-check.skip=false \
            -DfailBuildOnCVSS=7.0 \
            -X \
            -B
        continue-on-error: true

      - name: Upload Maven Security Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maven-security-report
          path: target/dependency-check-report.*
          retention-days: 30
          if-no-files-found: ignore

  sast-analysis:
    name: SAST Analysis (SonarQube)
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') }}
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: '**/pom.xml'

      - name: Build for SonarQube
        run: mvn clean compile -DskipTests -B

      - name: SonarQube Scan
        run: |
          mvn sonar:sonar \
            -Dsonar.projectKey=leadflow-backend \
            -Dsonar.sources=src/main \
            -Dsonar.host.url=${{ secrets.SONARQUBE_HOST_URL }} \
            -Dsonar.login=${{ secrets.SONARQUBE_TOKEN }} \
            -Dsonar.qualitygate.wait=true \
            -B
        continue-on-error: true

  open-source-license-check:
    name: Open Source License Compliance
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: '**/pom.xml'

      - name: Generate license report
        run: mvn org.apache.maven.plugins:maven-license-plugin:2.0.0:aggregate-add-third-party -B
        continue-on-error: true

      - name: Upload license report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: license-report
          path: "target/THIRD-PARTY.txt"
          retention-days: 30
          if-no-files-found: ignore

  security-summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs: [ dependency-check, maven-security, sast-analysis ]
    if: always()
    
    steps:
      - name: Download all reports
        uses: actions/download-artifact@v4

      - name: Generate security report summary
        run: |
          echo "## 🔒 Security Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Dependency Check: Completed" >> $GITHUB_STEP_SUMMARY
          echo "✅ Maven Vulnerabilities: Scanned" >> $GITHUB_STEP_SUMMARY
          echo "✅ SAST Analysis (SonarQube): Completed" >> $GITHUB_STEP_SUMMARY
          echo "✅ License Compliance: Checked" >> $GITHUB_STEP_SUMMARY

      - name: Comment on PR with security results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '## 🔒 Security Scan Results\n\n✅ All security scans completed\n\nDetails:\n- **Dependency Check**: ✅ Scanned\n- **Maven Vulnerabilities**: ✅ Checked\n- **SAST Analysis**: ✅ Running\n- **License Compliance**: ✅ Verified\n\n👉 Check the [Security tab](../../security) for detailed results.'
            });

      - name: Notify Slack on security issues
        if: failure()
        uses: slackapi/slack-github-action@v1.24
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL_SECURITY }}
        with:
          payload: |
            {
              "text": "⚠️ Security Scan Issues Detected",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*⚠️ SECURITY SCAN DETECTED ISSUES*\n*Repository:* ${{ github.repository }}\n*Branch:* ${{ github.ref_name }}\n*URL:* <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Details>"
                  }
                }
              ]
            }

      - name: Run OWASP ZAP scan
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: zaproxy/action-baseline@v0.7.0
        with:
          target: ${{ secrets.STAGING_URL || 'https://api-staging.leadflow.io' }}

      - name: Upload ZAP report
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: zap-security-report
          path: report_html.html
          retention-days: 30

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Check for hardcoded secrets
        run: |
          docker run --rm -v "$(pwd):/path" zricethezav/gitleaks:latest \
            detect --source /path --verbose || true

      - name: License compliance check
        run: |
          mvn license:check \
            -Dlicense.excludedScopes=test || true

      - name: SBOM generation (SPDX)
        run: |
          mvn cyclonedx:makeAggregate -DincludeTransitiveDependencies=true || true

      - name: Upload SBOM
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: sbom-spdx
          path: target/bom.xml
          retention-days: 30

      - name: Vulnerability report summary
        if: always()
        run: |
          echo "# Security Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Scans Performed" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Dependency Check (Maven vulnerabilities)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ OWASP ZAP (Web vulnerabilities)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Trivy (Container vulnerabilities)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ GitLeaks (Secret leakage)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ License Compliance" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ SBOM Generation" >> $GITHUB_STEP_SUMMARY

      - name: Notify security team on critical issues
        if: failure() && github.event_name == 'schedule'
        uses: slackapi/slack-github-action@v1
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_SECURITY_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
        with:
          payload: |
            {
              "text": "⚠️ Critical Security Issues Detected",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Security Alert: ⚠️ CRITICAL ISSUES FOUND*\n*Project:* LeadFlow Backend\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Details>"
                  }
                }
              ]
            }
