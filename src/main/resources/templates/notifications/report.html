<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <style>
        body { font-family: Arial, sans-serif; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; }
        .report { padding: 15px; background-color: #e8f4f8; }
        .footer { text-align: center; padding: 10px; font-size: 12px; color: #666; }
    </style>
</head>
<body>
    <div class="container">
        <div class="report">
            <h2>📊 Seu Relatório</h2>
            <p th:text="${title}">Título do relatório</p>
            <div th:utext="${content}"></div>
            <p><strong>Período:</strong> <span th:text="${period}">período</span></p>
        </div>
        <div class="footer">
            <p>© 2026 LeadFlow. Todos os direitos reservados.</p>
        </div>
    </div>
</body>
</html>
